<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manan Gohil — Computer Science (Data Science) student building AI, data and web projects."
    />
    <meta name="theme-color" content="#f3ead6" />
    <script>
      // Set the theme before first paint to avoid a flash. Falls back to the
      // OS preference until the visitor picks a side (then we remember it).
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var night = saved ? saved === 'night' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', night ? 'night' : 'day')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', night ? '#1c1916' : '#f3ead6')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Manan Gohil — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
